name: Build Acervo Publisher

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller python-docx keyring

      - name: Build Publisher
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "Acervo Publisher" --hidden-import=keyring.backends.Windows tools/acervo_publisher.py

      - name: Upload Publisher
        uses: actions/upload-artifact@v4
        with:
          name: Acervo Publisher Windows
          path: dist/Acervo Publisher.exe
